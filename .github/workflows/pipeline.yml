name: pipeline

"on":
  push:
  workflow_dispatch: {}
  schedule:
    # Daily. GitHub schedules on the default branch only.
    - cron: "0 6 * * *"

jobs:
  test:
    # Runs on every push. No trained models needed: every test in tests/
    # exercises pure functions with in-memory fixtures (fake/toy models,
    # not the real trained artifacts), so this job needs no data download
    # and no model download at all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      # python -m pytest, not bare `pytest`: without -m, the current
      # directory isn't put on sys.path the same way, so `pipeline` isn't
      # importable as a package (this bit us - see docs/decisions.md).
      - run: python -m pytest

  pipeline:
    # Scheduled daily run of the actual pipeline stages, in order.
    #
    # Trained model artifacts (models/*.joblib, models/*.pkl, the ~56MB
    # BERTopic pickle) and the HF model cache are gitignored on purpose - a
    # fresh checkout has none of them. This job restores them from
    # actions/cache first.
    #
    # Real, previously-undetected bug, found 2026-10-10 by checking `gh run
    # list` across the repo's full history, not assumed from the comment
    # that used to be here: the `score`/`topics` steps had a 0% success
    # rate across all 30 runs since the repo's first commit - not an
    # "occasional cold-cache eviction" as previously documented, but a
    # permanent failure, because nothing in this workflow ever TRAINS the
    # self-trained artifacts (train_baseline.py / fit_topics.py are
    # deliberate one-off scripts, never wired into CI) - so the cache this
    # job restores from had never once been populated, by anyone, ever.
    #
    # Fix: on a cache miss, train/fit here using the exact same scripts a
    # human runs locally, then compare the freshly-produced artifact's
    # metrics against the pinned registry entry's metrics WITHIN A
    # TOLERANCE, not exact sha equality.
    #
    # Why tolerance, not exact sha match: tried exact sha first (2026-10-10)
    # and it failed on the very first real run - scikit-learn/UMAP training
    # is only bit-identical given identical floating-point behavior, and
    # this Ubuntu runner's BLAS produces slightly different results than
    # the macOS dev machine that trained the pinned model (accuracy
    # 0.9502539929522676 here vs. the pinned 0.9507574024072125 - a real,
    # tiny difference, not a bug). Exact-byte-hash pinning and "retrain
    # fresh on different hardware" are fundamentally incompatible - see
    # docs/decisions.md for the full comparison. If metrics are within
    # tolerance, this run's config (in-workspace only, never committed or
    # pushed) is repointed at the freshly-trained sha so `make score` /
    # `make topics` below actually have a file to load - the committed pin
    # in git is untouched and stays authoritative for local/production use.
    # If metrics are NOT within tolerance, fail loudly - that is a real
    # divergence worth a human looking at, not noise.
    runs-on: ubuntu-latest
    env:
      # The Makefile's targets call $(PYTHON), defaulting to .venv/bin/python
      # for local runs - there's no .venv/ on this runner (setup-python
      # installs directly), so override it to plain `python` (this bit us -
      # every make step failed with ".venv/bin/python: No such file or
      # directory" until this was added; see docs/decisions.md).
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt

      # Keyed on config/pipeline.yaml since that's where every pin (dataset
      # category, active_model_sha, distilbert/embedding revisions) lives -
      # a deliberate pin change is exactly what should bust this cache.
      # Trade-off: an unrelated config edit (e.g. window.lookback_days)
      # busts it too; accepted for simplicity in a portfolio-scale project.
      - id: cache
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            models/hf_cache
            models/*.joblib
            models/*.pkl
          key: pipeline-artifacts-${{ hashFiles('config/pipeline.yaml') }}

      - name: Download raw data and pretrained models (idempotent, cache-aware)
        run: |
          python scripts/download_data.py
          python scripts/download_model.py

      # Only runs on a cache miss - a cache hit means these artifacts
      # already exist and were already verified against the pin by a
      # previous run, so retraining again would be redundant work, not
      # extra safety.
      - name: Train baseline + fit topics (cache miss only)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python -m scripts.train_baseline
          python -m scripts.fit_topics

      - name: Verify freshly-trained artifacts are within tolerance of the pin (cache miss only)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python -c "
          import json, sys, yaml
          from pathlib import Path

          METRIC_TOLERANCE = 0.005      # baseline accuracy/f1, absolute difference
          N_TOPICS_TOLERANCE = 5        # topic count, absolute difference
          OUTLIER_RATE_TOLERANCE = 0.05 # outlier share of training rows, absolute difference

          config_path = Path('config/pipeline.yaml')
          config = yaml.safe_load(config_path.read_text())
          failures = []

          registry = json.loads(Path('models/registry.json').read_text())
          pinned_sha = config['model']['baseline']['active_model_sha']
          pinned = next((e for e in registry if e['sha256'] == pinned_sha), None)
          fresh = registry[-1]
          if pinned is None:
              failures.append(f'baseline: pinned sha {pinned_sha[:12]} not found in models/registry.json at all')
          else:
              for metric in ('accuracy', 'f1'):
                  diff = abs(fresh['metrics'][metric] - pinned['metrics'][metric])
                  if diff > METRIC_TOLERANCE:
                      failures.append(f'baseline {metric}: pinned={pinned[\"metrics\"][metric]:.4f} fresh={fresh[\"metrics\"][metric]:.4f} diff={diff:.4f} > {METRIC_TOLERANCE}')
              if not failures:
                  print(f'baseline within tolerance (pinned sha {pinned_sha[:12]}, fresh sha {fresh[\"sha256\"][:12]}) - using fresh artifact for this run only')
                  config['model']['baseline']['active_model_sha'] = fresh['sha256']

          topics_registry = json.loads(Path('models/topics_registry.json').read_text())
          pinned_topics_sha = config['topics']['active_model_sha']
          pinned_t = next((e for e in topics_registry if e['sha256'] == pinned_topics_sha), None)
          fresh_t = topics_registry[-1]
          if pinned_t is None:
              failures.append(f'topics: pinned sha {pinned_topics_sha[:12]} not found in models/topics_registry.json at all')
          else:
              n_topics_diff = abs(fresh_t['n_topics'] - pinned_t['n_topics'])
              pinned_rate = pinned_t['n_outliers'] / pinned_t['training_rows']
              fresh_rate = fresh_t['n_outliers'] / fresh_t['training_rows']
              rate_diff = abs(fresh_rate - pinned_rate)
              if n_topics_diff > N_TOPICS_TOLERANCE:
                  failures.append(f'topics n_topics: pinned={pinned_t[\"n_topics\"]} fresh={fresh_t[\"n_topics\"]} diff={n_topics_diff} > {N_TOPICS_TOLERANCE}')
              if rate_diff > OUTLIER_RATE_TOLERANCE:
                  failures.append(f'topics outlier_rate: pinned={pinned_rate:.3f} fresh={fresh_rate:.3f} diff={rate_diff:.3f} > {OUTLIER_RATE_TOLERANCE}')
              if n_topics_diff <= N_TOPICS_TOLERANCE and rate_diff <= OUTLIER_RATE_TOLERANCE:
                  print(f'topics within tolerance (pinned sha {pinned_topics_sha[:12]}, fresh sha {fresh_t[\"sha256\"][:12]}) - using fresh artifact for this run only')
                  config['topics']['active_model_sha'] = fresh_t['sha256']

          if failures:
              print('Freshly-trained artifacts diverge from the pin by more than tolerance:')
              for f in failures:
                  print(f'  {f}')
              print('This needs a human to look at - a real data/config problem, or the tolerance')
              print('itself needs revisiting, not a blind retry.')
              sys.exit(1)

          config_path.write_text(yaml.safe_dump(config, sort_keys=False))
          print('Rewrote this run\'s in-workspace config to the freshly-trained shas (not committed).')
          "

      - run: make ingest
      - run: make validate
      - run: make score
      - run: make embed
      - run: make topics
      - run: make aggregate

      - run: make detect

# Hand-edited from scripts/fit_topics.py's auto-generated keyword stems,
# grounded in each topic's actual representative documents
# (model.get_representative_docs(topic_id)) - not guessed from keywords
# alone. Commit this file.
#
# Topic -1 is BERTopic's outlier bucket (documents that didn't fit any
# cluster confidently), not a real theme.
#
# Re-run fit_topics.py only deliberately: a refit changes what these
# topic ids mean, so this file needs re-editing after every refit. This is
# the second hand-edit of this file - the first (for the previous 50-topic
# fit) was discarded wholesale when the window widened and the model was
# refit, exactly as documented here the first time around.
#
# Observations worth knowing about THIS fit (min_cluster_size=30,
# min_samples=10 - see config/pipeline.yaml):
# - Topics 0 and 2 are both "terse one-star reviews with almost no
#   content" - a near-duplicate split, same fragmentation pattern as the
#   previous fit (then it was the sound-quality topics; refitting doesn't
#   eliminate fragmentation, it just relocates it).
# - Topics 23 and 24 are both "cracked/broken CD case."
# - Topics 25, 31, and 44 are THREE near-duplicate "Beatles/Apple bootleg,
#   buyer beware" clusters - more fragmented than the previous fit's two.
# - Topics 34, 35, and 43 each have the *exact same review text* repeated
#   2-3 times in their top representative documents - a sign these
#   clusters are small and sparse, not that the data is corrupted.
# - Topics 4, 37, and 42 are a misleading book, a food item, and a garden
#   hose - items miscategorized into Digital_Music in the source dataset,
#   the same three kinds of miscategorization found in the previous fit
#   (though not necessarily the same literal reviews, since the training
#   population changed).

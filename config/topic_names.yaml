# Hand-edited from scripts/fit_topics.py's auto-generated keyword stems,
# grounded in each topic's actual representative documents
# (model.get_representative_docs(topic_id)) - not guessed from keywords
# alone. Commit this file.
#
# Topic -1 is BERTopic's outlier bucket (documents that didn't fit any
# cluster confidently), not a real theme.
#
# Re-run fit_topics.py only deliberately: a refit changes what these
# topic ids mean, so this file needs re-editing after every refit.
#
# Observations worth knowing about this particular fit (min_cluster_size=30,
# min_samples=10 - see config/pipeline.yaml):
# - Topics 35 and 43 are near-duplicate "Beatles/Apple bootleg" clusters
#   that arguably should have merged into one.
# - Topics 13 and 22 are both "cracked/broken CD case."
# - Topics 23, 32, and 41 are all "poor sound/recording quality," split
#   into three separate clusters rather than one.
#   These suggest min_cluster_size/min_samples could be tuned tighter on a
#   refit to reduce fragmentation - not fixed here, since changing them
#   means a deliberate refit, not a silent edit of this label file.
# - Topics 8, 37, and 44 are reviews of a book, a food item, and a garden
#   hose/instrument part - items miscategorized into Digital_Music in the
#   source dataset, not a modeling error.
